[project]
name = "squatchscout-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi~=0.116",
  "uvicorn[standard]~=0.35",
  "sqlmodel~=0.0.24",
  "alembic~=1.16",
  "psycopg[binary]~=3.2",
  "pydantic-settings~=2.10",
  "httpx~=0.28",
  "selectolax~=0.3",
  "rapidfuzz~=3.13",
  "phonenumbers~=9.0",
  "dnspython~=2.7",
  "groq~=0.31",
  "sse-starlette~=2.4",
  "python-dotenv~=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest~=8.4",
  "pytest-asyncio~=1.1",
  "respx~=0.22",
  "ruff~=0.12",
  "anyio~=4.9",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
