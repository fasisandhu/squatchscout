name: deploy
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  api:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      # `secrets` is not a context GitHub allows in a job- or step-level `if`, so the
      # "is a VM configured yet?" test has to happen inside a step that reads it as env.
      # Without this, every push to main red-X'd the repo with "missing server host"
      # until the Task 27 secrets existed.
      - name: Check whether a deploy target is configured
        id: target
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -n "$DEPLOY_HOST" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::DEPLOY_HOST is not set, so there is no VM to deploy to. Set DEPLOY_HOST, DEPLOY_USER and DEPLOY_SSH_KEY to enable this job."
          fi
      - name: Deploy ${{ github.event.workflow_run.head_sha }} to the Ubuntu VM
        if: steps.target.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          script: /opt/squatchscout/deploy/deploy.sh ${{ github.event.workflow_run.head_sha }}
